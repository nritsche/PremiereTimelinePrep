[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "premiere-timeline-prep"
version = "0.1.0"
description = "Prepare footage and chronological timelines for Adobe Premiere Pro"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6", "tzdata>=2025.2"]
dev = ["pytest>=8", "PyInstaller>=6"]

[project.scripts]
premiere-timeline-prep = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
