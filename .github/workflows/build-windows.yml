name: Build Windows executable

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      collect_primary_sources:
        description: Collect primary upstream source archives for private licensing review (not approval)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  source-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 ffmpeg
      - run: python -m pip install -e ".[gui]" pytest
      - run: python -m pytest -q

  test-and-build:
    needs: [source-tests, secret-scan]
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned media tools
        shell: pwsh
        run: |
          choco install ffmpeg --version=9.0.2 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          choco install exiftool --version=13.59.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'ExifTool installation failed' }
      - name: Locate media tools
        id: media-tools
        shell: pwsh
        run: |
          $chocoLib = Join-Path $env:ChocolateyInstall 'lib'
          $ffprobe = Get-ChildItem (Join-Path $chocoLib 'ffmpeg/tools') -Filter 'ffprobe.exe' -Recurse | Select-Object -First 1
          $ffmpeg = Get-ChildItem (Join-Path $chocoLib 'ffmpeg/tools') -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          $exiftool = Get-ChildItem (Join-Path $chocoLib 'exiftool/tools') -Filter 'exiftool(-k).exe' -Recurse | Select-Object -First 1
          if (-not $exiftool) {
            $exiftool = Get-ChildItem (Join-Path $chocoLib 'exiftool/tools') -Filter 'exiftool.exe' -Recurse | Select-Object -First 1
          }
          if (-not $ffprobe) { throw 'FFprobe executable not found' }
          if (-not $ffmpeg) { throw 'FFmpeg executable not found' }
          if (-not $exiftool) { throw 'ExifTool executable not found' }
          "ffprobe=$($ffprobe.FullName)" >> $env:GITHUB_OUTPUT
          "ffmpeg=$($ffmpeg.FullName)" >> $env:GITHUB_OUTPUT
          "exiftool=$($exiftool.FullName)" >> $env:GITHUB_OUTPUT
      - name: Install pinned application and build dependencies
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency installation failed' }
          python -m pip install --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw 'Application installation failed' }
      - name: Run tests
        run: python -m pytest -q
      - name: Build standalone executable
        run: >-
          python scripts/build_windows.py
          --ffprobe "${{ steps.media-tools.outputs.ffprobe }}"
          --ffmpeg "${{ steps.media-tools.outputs.ffmpeg }}"
          --exiftool "${{ steps.media-tools.outputs.exiftool }}"
      - name: Test packaged executable and bundled tools
        run: python scripts/check_windows_bundle.py
      - name: Compare bundled probe metadata across synthetic media formats
        run: python scripts/check_ffprobe_compatibility.py
      - name: Collect primary source review materials
        if: github.event_name == 'workflow_dispatch' && github.event.repository.private == true && inputs.collect_primary_sources
        run: python scripts/collect_primary_sources.py
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-build-diagnostics
          path: |
            dist/PremiereTimelinePrep/self-test.json
            build-tools/ffprobe-compatibility.json
          if-no-files-found: ignore
      - name: Upload tested executable and notices
        if: vars.PUBLIC_BINARY_DISTRIBUTION_REVIEWED == 'true' || (github.event.repository.private == true && github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PremiereTimelinePrep-windows-x64
          path: dist/PremiereTimelinePrep/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload private primary source review materials
        if: github.event_name == 'workflow_dispatch' && github.event.repository.private == true && inputs.collect_primary_sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PremiereTimelinePrep-primary-source-review
          path: build-tools/primary-sources/
          if-no-files-found: error
