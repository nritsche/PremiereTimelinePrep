name: Prepare reviewed draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, e.g. v0.1.0-alpha.1
        required: true
      build_run_id:
        description: Successful Windows build workflow run ID
        required: true
      source_bundle_url:
        description: HTTPS ZIP of reviewed corresponding third-party source/build materials
        required: true
      source_bundle_sha256:
        description: SHA-256 of that source ZIP
        required: true
      compliance_reviewed:
        description: I completed the license/source distribution review in docs/RELEASE_CHECKLIST.md
        type: boolean
        default: false
        required: true

permissions:
  contents: write
  actions: read

jobs:
  secret-scan:
    permissions:
      contents: read
    uses: ./.github/workflows/secret-scan.yml

  draft:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify artifact and prepare draft (does not publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          SOURCE_BUNDLE_URL: ${{ inputs.source_bundle_url }}
          SOURCE_BUNDLE_SHA256: ${{ inputs.source_bundle_sha256 }}
          COMPLIANCE_REVIEWED: ${{ inputs.compliance_reviewed }}
        run: python scripts/create_draft_release.py
